name: Offline foundation and editor tests
on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal validator dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python packages and Forge entrypoint
        run: python -m compileall -q coherent_diffusion scripts tests
      - name: Validate schema, CRF, CPU reference, ZIP assets and probes
        run: python -m unittest discover -s tests -v
  browser-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt "gradio==4.40.0" "huggingface_hub==0.36.2" "fastapi==0.112.2" "starlette==0.38.6"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Editor Chromium interaction / CRF archive round-trip
        run: node tests/editor_browser.cjs
      - name: Verify actual Gradio 4 iframe rendering
        run: node tests/gradio_browser.cjs
