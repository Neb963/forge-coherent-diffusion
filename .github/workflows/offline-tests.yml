name: Offline foundation and editor tests
on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal validator dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python packages and Forge entrypoint
        run: python -m compileall -q coherent_diffusion scripts tests
      - name: Validate schema, CRF, CPU reference, ZIP assets and probes
        run: python -m unittest discover -s tests -v
  tensor-sdxl-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU-only torch for deterministic tensor contracts
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu
      - name: Install schema validator for P04 CRF semantic routing
        run: python -m pip install -r requirements.txt
      - name: Run P03 torch tensor sampler + fake Forge adapter tests
        run: python -m unittest discover -s tests -p 'test_sdxl_sync.py' -v
      - name: Run P04 progressive SDXL and semantic routing offline tests
        run: python -m unittest discover -s tests -p 'test_quality_p04.py' -v
      - name: Run P04 stage-specific Forge SDXL adapter stub tests
        run: python -m unittest discover -s tests -p 'test_forge_quality_p04.py' -v
      - name: Run P05 Anima flow, absolute RoPE, Forge/Q4-preservation stubs
        run: python -m unittest discover -s tests -p 'test_anima_p05.py' -v
      - name: Install bounded PNG raster decoder for P06 verified masks
        run: python -m pip install Pillow==11.3.0
      - name: Run P06 regional masks, LoRA scope and SDXL/Anima offline contracts
        run: python -m unittest discover -s tests -p 'test_regional_p06.py' -v
  browser-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt "gradio==4.40.0" "huggingface_hub==0.36.2" "fastapi==0.112.2" "starlette==0.38.6"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Editor Chromium interaction / CRF archive round-trip
        run: node tests/editor_browser.cjs
      - name: Numerical P02 planned-influence browser conformance
        run: node tests/influence_browser.cjs
      - name: Verify actual Gradio 4 iframe rendering
        run: node tests/gradio_browser.cjs
